name: Deploy to Heroku

on:
  push:
    branches:
      - deploy/heroku
  workflow_dispatch:

env:
  HEROKU_ANALYZER_APP: ashfak-diffshield-analyzer
  HEROKU_WEB_APP: ashfak-diffshield-web

jobs:
  deploy-analyzer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out deploy branch
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy analyzer container
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        working-directory: services/analyzer
        run: |
          heroku container:login
          heroku container:push web --app "$HEROKU_ANALYZER_APP"
          heroku container:release web --app "$HEROKU_ANALYZER_APP"

  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-analyzer
    permissions:
      contents: read
    steps:
      - name: Check out deploy branch
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy web container
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        working-directory: apps/web
        run: |
          heroku container:login
          heroku container:push web --app "$HEROKU_WEB_APP"
          heroku container:release web --app "$HEROKU_WEB_APP"
